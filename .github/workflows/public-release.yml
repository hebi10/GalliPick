name: Public APK release
run-name: GalliPick ${{ inputs.version || github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      ops01_release_approved:
        description: 'OPS-01: explicit approval after all planned work and final QA'
        required: true
        type: boolean
        default: false
      version:
        description: 'Release tag matching the app version, for example v0.1.6'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-apk-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'hebi10/GalliPick'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Manual releases must run from main.' >&2
            exit 1
          fi
          python3 scripts/release/verify_apk.py source --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
  device:
    needs: prepare
    uses: ./.github/workflows/device-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
  publish:
    needs: [prepare, verify, device]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.ops01_release_approved == true &&
      (github.repository == 'hebi10/GalliPick')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Install release SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore fixed signing key privately
        env:
          GALLIPICK_SIGNING_BUNDLE_BASE64: ${{ secrets.GALLIPICK_SIGNING_BUNDLE_BASE64 }}
        run: python3 scripts/release/signing_bundle.py restore
      - name: Build and verify signed release
        run: gradle --no-daemon :app:verifyGalliPickSigning :app:lintRelease :app:assembleRelease --stacktrace
      - name: Stage verified APK and checksum
        run: python3 scripts/release/verify_apk.py apk --tag "$RELEASE_TAG" --apk app/build/outputs/apk/release/app-release.apk --output release-dist
      - name: Upload draft, verify downloaded assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --repo "$GITHUB_REPOSITORY" --dist release-dist --notes "docs/releases/$RELEASE_TAG.md")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            arguments+=(--create-tag)
          fi
          python3 scripts/release/publish_release.py "${arguments[@]}"
      - name: Remove private signing files
        if: always()
        run: python3 scripts/release/signing_bundle.py cleanup
