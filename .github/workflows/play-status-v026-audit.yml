name: GalliPick Play alpha read-only audit
on:
  push:
    branches: ['audit-v0.2.6-play-status-20261107']
    paths: ['.github/workflows/play-status-v026-audit.yml']
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: github.repository == 'hebi10/GalliPick' && github.ref == 'refs/heads/audit-v0.2.6-play-status-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the existing closed-alpha track
        env:
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
        run: |
          test "$PLAY_CLOSED_TRACK" = "alpha" || { echo 'Expected existing closed track alpha.' >&2; exit 1; }
      - name: Authenticate to Play API (no publish)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
          cleanup_credentials: true
      - name: Read-only check of actual Play versions and tracks
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
        run: |
          python3 scripts/release/play_publish.py check --track "$PLAY_CLOSED_TRACK" --report play-status-v026.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("play-status-v026.json").read_text(encoding="utf-8"))
          print("Read-only Play status:", p.get("status"), p.get("track"))
          print("Existing version codes:", p.get("used_version_codes"))
          for item in p.get("tracks", []):
              print("Track", item.get("track"), "releases", item.get("releases"))
          PY
      - name: Save status evidence without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GalliPick-v0.2.6-readonly-play-status
          path: play-status-v026.json
          retention-days: 14
          if-no-files-found: warn
