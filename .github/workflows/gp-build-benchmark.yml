name: Android package benchmarks

on:
  pull_request:
    paths:
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'scripts/performance/gp_build.py'
      - 'scripts/performance/test_gp_build.py'
      - 'scripts/performance/gp_dex_metrics.py'
      - 'scripts/performance/test_gp_dex_metrics.py'
      - 'scripts/performance/gp_r8_compat.py'
      - 'scripts/performance/test_gp_r8_compat.py'
      - 'scripts/performance/gp_device.py'
      - 'scripts/performance/test_gp_device.py'
      - 'scripts/performance/gp_emulator.py'
      - 'scripts/performance/test_gp_emulator.py'
      - 'scripts/performance/gp_r8_regression.py'
      - 'scripts/performance/test_gp_r8_regression.py'
      - '.github/workflows/gp-build-benchmark.yml'
  workflow_dispatch:
    inputs:
      measure_device:
        description: Compare Play Cloud APKs on an emulator instead of measuring archives
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  measure:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.measure_device }}
    name: Package metrics (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [localOnly, devCloud, playCloud]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test package metrics, DEX coverage and R8 compatibility
        run: |
          python3 -B -m unittest discover -s scripts/performance -p 'test_gp_build.py'
          python3 -B -m unittest discover -s scripts/performance -p 'test_gp_dex_metrics.py'
          python3 -B -m unittest discover -s scripts/performance -p 'test_gp_r8_compat.py'
      - name: Test device metrics parser and ADB recovery
        if: matrix.profile == 'playCloud'
        run: python3 -B -m unittest discover -s scripts/performance -p 'test_gp_device.py'
      - name: Measure APK, AAB and runtime dependencies
        env:
          BUILD_PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d "$RUNNER_TEMP/gp-package.XXXXXX")"
          trap 'rm -rf "$temp_dir"' EXIT
          for attempt in 1 2; do
            output="$temp_dir/attempt-$attempt"
            log="$temp_dir/attempt-$attempt.log"
            if python3 scripts/performance/gp_build.py --profiles "$BUILD_PROFILE" --r8 --output "$output" 2>&1 | tee "$log"; then
              mkdir -p build/gp-build
              cp -a "$output/." build/gp-build/
              exit 0
            fi
            if [[ "$attempt" == 1 ]] && grep -Eq 'https://repo\.maven\.apache\.org/.*Received status code 429' "$log"; then
              echo 'Maven Central rate limit; retrying once after 30 seconds.'
              sleep 30
            else
              exit 1
            fi
          done
          exit 1
      - name: Upload measurements
        uses: actions/upload-artifact@v4
        with:
          name: package-metrics-${{ matrix.profile }}
          path: |
            build/gp-build/metrics.json
            build/gp-build/*-runtime.txt
          if-no-files-found: error
          retention-days: 14

  device:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.measure_device) }}
    name: Play Cloud baseline and R8 device benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test device metrics parser and emulator lifecycle
        run: |
          python3 -B -m unittest discover -s scripts/performance -p 'test_gp_device.py'
          python3 -B -m unittest discover -s scripts/performance -p 'test_gp_emulator.py'
          python3 -B -m unittest discover -s scripts/performance -p 'test_gp_r8_regression.py'
      - name: Ensure synthetic OCR fixture renderer is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -filters > "$RUNNER_TEMP/gp-ffmpeg-filters.txt" 2>&1
          grep -Eq '[[:space:]]drawtext[[:space:]]' "$RUNNER_TEMP/gp-ffmpeg-filters.txt"
      - name: Prepare and verify API 36 benchmark emulator before APK builds
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'emulator' 'system-images;android-36;default;x86_64'
          python3 scripts/performance/gp_emulator.py --prepare
      - name: Build and sign isolated APKs with an ephemeral key
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          keytool -genkeypair -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=GalliPick Device Benchmark' \
            -keystore "$key_dir/benchmark.p12" -storetype PKCS12 -alias benchmark -storepass android -keypass android
          mkdir -p build/gp-device
          for mode in baseline r8; do
            minified=false
            if [[ "$mode" == r8 ]]; then minified=true; fi
            ./gradlew --no-daemon --stacktrace --max-workers=2 :app:clean :app:assembleReleaseBenchmark \
              -PgallipickBuildBenchmark=playCloud -PgallipickMinifyBenchmark="$minified" \
              -PgallipickTestSigning=true -PgallipickPlayCloudPilot=false -PgallipickCloudEnvironment=development \
              -PgallipickAdsEnabled=false -PgallipickAdsTest=false -PgallipickAdsPreview=false
            unsigned=(app/build/outputs/apk/releaseBenchmark/*.apk)
            [[ ${#unsigned[@]} -eq 1 && -f "${unsigned[0]}" ]]
            [[ "$(apkanalyzer manifest application-id "${unsigned[0]}")" == com.hebi.gallipick.benchmark ]]
            "$build_tools/zipalign" -f -P 16 4 "${unsigned[0]}" "$key_dir/aligned.apk"
            "$build_tools/apksigner" sign --ks "$key_dir/benchmark.p12" --ks-pass pass:android \
              --out "build/gp-device/$mode.apk" "$key_dir/aligned.apk"
            "$build_tools/apksigner" verify "build/gp-device/$mode.apk"
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device benchmark with bounded emulator cleanup
        run: python3 scripts/performance/gp_emulator.py
      - name: Upload device measurements
        uses: actions/upload-artifact@v4
        with:
          name: play-cloud-device-metrics
          path: |
            build/gp-device/metrics.json
            build/gp-device/regression.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed emulator UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: play-cloud-device-failure-diagnostics
          path: build/gp-device/ui-failure/
          if-no-files-found: ignore
          retention-days: 14
