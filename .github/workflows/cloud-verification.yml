name: Cloud backend verification

on:
  pull_request:
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/cloud-verification.yml'
  push:
    branches: [main]
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/cloud-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run cloud backend tests
        run: npm test
