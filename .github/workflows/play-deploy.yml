name: Play testing deployment
run-name: GalliPick Play ${{ inputs.mode || 'deploy' }} · ${{ inputs.target || 'internal' }} · ${{ github.ref_name }}
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/build.gradle.kts']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check configuration, build signed files, or deploy to the selected testing track'
        required: true
        default: build
        type: choice
        options: [check, build, deploy]
      target:
        description: 'Testing target; closed requires an existing PLAY_CLOSED_TRACK variable'
        required: true
        default: internal
        type: choice
        options: [internal, closed]
permissions:
  contents: read
concurrency:
  group: gallipick-play-publish
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'hebi10/GalliPick' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[deploy-internal]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.source.outputs.mode }}
      target: ${{ steps.source.outputs.target }}
      track: ${{ steps.source.outputs.track }}
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release source and main ancestry
        id: source
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TARGET: ${{ inputs.target }}
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo 'Manual Play runs must use main.' >&2
              exit 1
            fi
            MODE="${INPUT_MODE:-build}"
            TARGET="${INPUT_TARGET:-internal}"
            RELEASE_TAG="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from verify_apk import parse_source_version
          version, _ = parse_source_version(Path('app/build.gradle.kts').read_text(encoding='utf-8'))
          print('v' + version)
          PY
          )"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            MODE=deploy
            TARGET=internal
            RELEASE_TAG="$REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Main pushes deploy only on an explicit release-intent commit and a
            # source versionCode increase. Unrelated Gradle edits never publish.
            MODE=deploy
            TARGET=internal
            RELEASE_TAG="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from verify_apk import parse_source_version
          version, _ = parse_source_version(Path('app/build.gradle.kts').read_text(encoding='utf-8'))
          print('v' + version)
          PY
          )"
            python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from verify_apk import parse_source_version
          previous_source = subprocess.check_output(
              ['git', 'show', 'HEAD^:app/build.gradle.kts'], text=True)
          _, previous_code = parse_source_version(previous_source)
          _, next_code = parse_source_version(Path('app/build.gradle.kts').read_text(encoding='utf-8'))
          if next_code <= previous_code:
              raise SystemExit('Internal release requires a higher versionCode than the previous main commit.')
          print(f'Intentional internal release versionCode: {previous_code} -> {next_code}')
          PY
          else
            echo 'Automatic Play runs require a version tag or an intentional main release commit.' >&2
            exit 1
          fi
          case "$MODE" in
            check|build|deploy) ;;
            *) echo 'Unsupported Play mode.' >&2; exit 1 ;;
          esac
          case "$TARGET" in
            internal) TRACK=internal ;;
            closed)
              TRACK="$PLAY_CLOSED_TRACK"
              if [[ -z "$TRACK" ]]; then
                if [[ "$MODE" != "build" ]]; then
                  echo 'Missing repository variable PLAY_CLOSED_TRACK: set the exact existing closed-track API ID.' >&2
                  exit 1
                fi
              elif [[ ! "$TRACK" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ || "${TRACK,,}" =~ ^(production|beta|internal)$ ]]; then
                echo 'PLAY_CLOSED_TRACK must identify an existing closed track; production, beta, internal and form-factor tracks are forbidden.' >&2
                exit 1
              fi
              ;;
            *) echo 'Unsupported Play target.' >&2; exit 1 ;;
          esac
          python3 scripts/release/verify_apk.py source --tag "$RELEASE_TAG"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]]; then
              echo 'The release tag does not identify the checked-out source.' >&2
              exit 1
            fi
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo 'The release source must be an ancestor of current origin/main.' >&2
            exit 1
          fi
          printf 'mode=%s\ntarget=%s\ntrack=%s\ntag=%s\ncommit=%s\n' "$MODE" "$TARGET" "$TRACK" "$RELEASE_TAG" "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  signing-check:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Restore and check fixed signing recovery
        env:
          GALLIPICK_SIGNING_BUNDLE_BASE64: ${{ secrets.GALLIPICK_SIGNING_BUNDLE_BASE64 }}
        run: python3 scripts/release/signing_bundle.py restore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Install release SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify the actual private key and pinned certificate
        run: gradle --no-daemon --no-configuration-cache :app:verifyGalliPickSigning --max-workers=2
      - name: Remove private signing files
        if: always()
        run: python3 scripts/release/signing_bundle.py cleanup

  play-preflight:
    needs: prepare
    if: needs.prepare.outputs.mode != 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PLAY_TRACK: ${{ needs.prepare.outputs.track }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Check required Play configuration before authentication
        id: config
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -n "$PLAY_WORKLOAD_IDENTITY_PROVIDER" ]]; then
            if [[ -z "$PLAY_SERVICE_ACCOUNT" ]]; then
              echo 'Missing repository variable PLAY_SERVICE_ACCOUNT for Workload Identity Federation.' >&2
              missing=1
            fi
            method=wif
          elif [[ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            method=json
          else
            echo 'Missing Play authentication: configure PLAY_WORKLOAD_IDENTITY_PROVIDER and PLAY_SERVICE_ACCOUNT variables, or GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret.' >&2
            missing=1
          fi
          if [[ "$missing" != 0 ]]; then
            exit 1
          fi
          printf 'method=%s\n' "$method" >> "$GITHUB_OUTPUT"
      - name: Authenticate with Workload Identity Federation
        if: steps.config.outputs.method == 'wif'
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
          cleanup_credentials: true
      - name: Authenticate with service account JSON
        if: steps.config.outputs.method == 'json'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
          cleanup_credentials: true
      - name: Inspect Play access and the selected testing track
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: python3 scripts/release/play_publish.py check --track "$PLAY_TRACK" --report play-preflight.json
      - name: Save the public Play preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GalliPick-${{ needs.prepare.outputs.tag }}-play-preflight
          path: play-preflight.json
          if-no-files-found: ignore
          retention-days: 14

  verify:
    needs: prepare
    if: needs.prepare.outputs.mode == 'deploy'
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  device:
    needs: prepare
    if: needs.prepare.outputs.mode == 'deploy'
    uses: ./.github/workflows/device-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  build:
    needs: [prepare, signing-check, play-preflight, verify, device]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.signing-check.result == 'success' &&
      (needs.prepare.outputs.mode == 'build' ||
      (needs.prepare.outputs.mode == 'deploy' && needs.play-preflight.result == 'success' &&
      needs.verify.result == 'success' && needs.device.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Restore fixed signing key privately
        env:
          GALLIPICK_SIGNING_BUNDLE_BASE64: ${{ secrets.GALLIPICK_SIGNING_BUNDLE_BASE64 }}
        run: python3 scripts/release/signing_bundle.py restore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Install release SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Download pinned bundletool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Test release verification tools
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Test, lint and build both fixed-key release files
        run: gradle --no-daemon --no-configuration-cache :app:verifyGalliPickSigning :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --max-workers=2
      - name: Verify and stage the signed APK
        run: python3 scripts/release/verify_apk.py apk --tag "$RELEASE_TAG" --apk app/build/outputs/apk/release/app-release.apk --output release-dist
      - name: Verify and stage the signed Play bundle
        run: python3 scripts/release/verify_aab.py --tag "$RELEASE_TAG" --bundle app/build/outputs/bundle/release/app-release.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --output play-dist
      - name: Save the verified signed APK and checksum
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: GalliPick-${{ needs.prepare.outputs.tag }}-signed-apk
          path: |
            release-dist/GalliPick-${{ needs.prepare.outputs.tag }}-release.apk
            release-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Save the verified signed bundle and public provenance
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: GalliPick-${{ needs.prepare.outputs.tag }}-play-bundle
          path: |
            play-dist/GalliPick-${{ needs.prepare.outputs.tag }}-release.aab
            play-dist/SHA256SUMS
            play-dist/manifest.json
            play-dist/provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Link verified release artifacts
        env:
          APK_ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
          BUNDLE_ARTIFACT_URL: ${{ steps.bundle.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Verified fixed-key release: `%s` at `%s`.\n\n' "$RELEASE_TAG" "$RELEASE_COMMIT"
            printf -- '- [Signed APK and checksum](%s)\n' "$APK_ARTIFACT_URL"
            printf -- '- [Signed AAB, checksum and public provenance](%s)\n' "$BUNDLE_ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private signing files
        if: always()
        run: python3 scripts/release/signing_bundle.py cleanup

  deploy:
    needs: [prepare, build]
    if: needs.prepare.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PLAY_TRACK: ${{ needs.prepare.outputs.track }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Download the verified bundle from this run
        uses: actions/download-artifact@v4
        with:
          name: GalliPick-${{ needs.prepare.outputs.tag }}-play-bundle
          path: play-dist
      - name: Check required Play configuration before authentication
        id: config
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -n "$PLAY_WORKLOAD_IDENTITY_PROVIDER" ]]; then
            if [[ -z "$PLAY_SERVICE_ACCOUNT" ]]; then
              echo 'Missing repository variable PLAY_SERVICE_ACCOUNT for Workload Identity Federation.' >&2
              missing=1
            fi
            method=wif
          elif [[ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            method=json
          else
            echo 'Missing Play authentication: configure PLAY_WORKLOAD_IDENTITY_PROVIDER and PLAY_SERVICE_ACCOUNT variables, or GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret.' >&2
            missing=1
          fi
          if [[ "$missing" != 0 ]]; then
            exit 1
          fi
          printf 'method=%s\n' "$method" >> "$GITHUB_OUTPUT"
      - name: Authenticate with Workload Identity Federation
        if: steps.config.outputs.method == 'wif'
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
          cleanup_credentials: true
      - name: Authenticate with service account JSON
        if: steps.config.outputs.method == 'json'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
          cleanup_credentials: true
      - name: Submit only to the selected testing track
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: python3 scripts/release/play_publish.py deploy --track "$PLAY_TRACK" --bundle "play-dist/GalliPick-${RELEASE_TAG}-release.aab" --manifest play-dist/manifest.json --notes docs/play-store/release-notes-ko.txt --report play-deployment.json
      - name: Save the public Play deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GalliPick-${{ needs.prepare.outputs.tag }}-play-deployment
          path: play-deployment.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize the accepted API commit
        shell: bash
        run: |
          printf 'The `%s` testing-track API commit was accepted and read back. Google review and tester availability must still be checked in Play Console.\n' "$PLAY_TRACK" >> "$GITHUB_STEP_SUMMARY"
