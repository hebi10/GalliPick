name: Stage 7 regenerate verified Play images

on:
  push:
    branches: ['design-release-stage7-*']
    paths:
      - '.github/workflows/stage7-store-assets.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gallipick-stage7-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'hebi10/GalliPick'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the original successful Android capture run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=42009167309
          source_commit=1a5f61b7b0e6d2f217f793ac31a60654180b24f4
          [[ "$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" == "$source_commit" ]] || {
            echo 'Android capture provenance does not match the approved commit.' >&2
            exit 1
          }
          [[ "$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" == success ]] || {
            echo 'Android capture verification did not succeed.' >&2
            exit 1
          }
          mkdir -p captured
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name native-captures-phone-portrait --dir captured
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          manifests = list(Path('captured').rglob('native-example-media-phone-portrait-*-manifest.json'))
          assert len(manifests) == 1, 'Expected exactly one original screenshot manifest'
          m = json.loads(manifests[0].read_text())
          assert m['activity'] == 'com.hebi.gallipick.MainActivity'
          assert m['profile'] == 'phone-portrait'
          assert m['captureMethod'].startswith('UiAutomation.takeScreenshot')
          assert len(m['captures']) == 11
          for capture in m['captures']:
              files = list(Path('captured').rglob(capture['file']))
              assert len(files) == 1, capture
              header = files[0].read_bytes()[:24]
              assert header[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', header[16:24]) == (1080, 2400), capture
          print('Verified eleven real Android phone screenshots.')
          PY
      - name: Install Korean fonts and Pillow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'Pillow==11.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Compose and verify GalliPick ko-KR Play assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/design/package_store_assets.py \
            --captures captured \
            --cat app/src/main/res/drawable-nodpi/gp_cat_organize.png \
            --output assets/play-store/ko-KR \
            --source-commit 1a5f61b7b0e6d2f217f793ac31a60654180b24f4 \
            --source-run 42009167309
          python3 scripts/release/play_listing_images.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('assets/play-store/ko-KR/manifest.json').read_text(encoding='utf-8'))
          assert manifest['source_commit'] == '1a5f61b7b0e6d2f217f793ac31a60654180b24f4'
          assert manifest['source_run'] == '42009167309'
          assert len(manifest['screenshots']) == 7
          print('Seven PNG composites and feature graphic validated.')
          PY
      - name: Save reviewed asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalliPick-stage7-ko-KR-play-images
          path: assets/play-store/ko-KR/
          retention-days: 14
          if-no-files-found: error
      - name: Commit verified PNG files to stage 7 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/play-store/ko-KR/manifest.json
          git add assets/play-store/ko-KR/01-home.png assets/play-store/ko-KR/02-files.png \
            assets/play-store/ko-KR/03-filters.png assets/play-store/ko-KR/04-duplicates.png \
            assets/play-store/ko-KR/05-comparison.png assets/play-store/ko-KR/06-cleanup.png \
            assets/play-store/ko-KR/07-dark-mode.png assets/play-store/ko-KR/feature-graphic.png
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Genuine store images already match the approved source.'
          else
            git commit -m 'Stage 7: refresh store screenshots from verified Android captures'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
