name: GalliPick navigation-first verified Play screenshots
on:
  push:
    branches: ['design-nav-store-review-*']
    paths:
      - '.github/workflows/store-nav-regeneration.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: gallipick-nav-store-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'hebi10/GalliPick'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm capture provenance and download genuine screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=42023456154
          expected_head=2d3cf757a934d4588984b644ebe246ee64e9a37a
          head="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          conclusion="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          test "$head" = "$expected_head" || { echo "Unexpected Android capture source SHA" >&2; exit 1; }
          test "$conclusion" = success || { echo "Android capture run did not pass" >&2; exit 1; }
          mkdir -p captured
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name native-captures-phone-portrait --dir captured
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          matches = list(Path('captured').rglob('native-example-media-phone-portrait-*-manifest.json'))
          assert len(matches) == 1, f'Expected one native Android manifest, found {len(matches)}'
          manifest = json.loads(matches[0].read_text(encoding='utf-8'))
          assert manifest['activity'] == 'com.hebi.gallipick.MainActivity'
          assert manifest['profile'] == 'phone-portrait'
          assert manifest['captureMethod'].startswith('UiAutomation.takeScreenshot')
          original = [c['screen'] for c in manifest['captures']]
          required = ['01-home','02-files','09-duplicates-scanned','04-cleanup',
                      '05-settings-dark','08-files-filter-dialog','10-duplicate-comparison']
          for screen in required:
              assert screen in original, f'Missing verified Android screen: {screen}'
              image = list(Path('captured').rglob('*-' + screen + '.png'))
              assert len(image) == 1, screen
              header = image[0].read_bytes()[:24]
              assert header[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', header[16:24]) == (1080,2400), screen
          print('Verified all five native tabs plus two modal screens.')
          PY
      - name: Install Korean fonts and Pillow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'Pillow==11.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Build navigation-first store assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/design/package_store_assets.py \
            --captures captured \
            --cat app/src/main/res/drawable-nodpi/gp_cat_organize.png \
            --output assets/play-store/ko-KR \
            --source-commit 2d3cf757a934d4588984b644ebe246ee64e9a37a \
            --source-run 42023456154
          python3 scripts/release/play_listing_images.py
          python3 -m unittest discover -s scripts/release -p 'test_play_listing_images.py'
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('assets/play-store/ko-KR/manifest.json').read_text(encoding='utf-8'))
          assert m['source_commit'] == '2d3cf757a934d4588984b644ebe246ee64e9a37a'
          assert m['source_run'] == '42023456154'
          assert len(m['screenshots']) == 7
          assert len(m['primary_tabs']) == 5
          print('Validated real nav screenshots, dimensions, order and hashes.')
          PY
      - name: Archive 7 final screenshots and feature image for design review
        uses: actions/upload-artifact@v4
        with:
          name: GalliPick-nav-first-real-store-images
          path: assets/play-store/ko-KR/
          if-no-files-found: error
          retention-days: 14
      - name: Commit approved binary screenshots and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/play-store/ko-KR
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh genuine Play images with all five navigation destinations first'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
